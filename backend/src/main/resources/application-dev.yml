environment: local

hostDatabase: localhost
hostKeycloak: localhost


spring:
  datasource:
    url: jdbc:postgresql://${hostDatabase}:5432/nls-maps?ApplicationName=nls-accessibility-map&stringtype=unspecified
    username: nls-maps
    password: nls-maps
nu:
  ndw:
    nls:
      accessibilitymap:
        bounding-box-area:
          search-distance-multiplier: 3
        network:
          cache:
            load-data-on-startup: false
            watch-for-updates: false
        trafficSigns:
          cache:
            load-data-on-startup: false
            watch-for-updates: false
        speedLimit:
          cache:
            load-data-on-startup: false
            watch-for-updates: false
      springboot:
        message:
          stream:
            queues:
              updateRoadSection:
                messages-to-skip:
                listener-auto-start: true
nls:
  keycloak:
    url: http://${hostKeycloak}:8000/auth

management:
  datadog:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: INFO
    nu.ndw.nls: TRACE
